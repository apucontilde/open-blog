<!DOCTYPE html>
<html lang="en" data-theme="luxury">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Open Blog</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/daisyui@5.5.19/daisyui.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/daisyui@5.5.19/themes.css">
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.2.4/dist/index.global.js"></script>
<link rel="stylesheet" href="./styles.css">
</head>
<body class="bg-base-100 text-base-content">
  <div id="app" class="min-h-screen"></div>
  <div id="toast" class="toast toast-end z-50"></div>

  <dialog id="tenant-dialog" class="modal">
    <div class="modal-box">
      <h3 class="text-lg font-bold">New tenant</h3>
      <form id="tenant-form" class="mt-3 space-y-2">
        <fieldset class="fieldset">
          <legend class="fieldset-legend">Slug</legend>
          <input name="slug" class="input w-full font-mono" placeholder="acme" required
                 pattern="[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?">
        </fieldset>
        <fieldset class="fieldset">
          <legend class="fieldset-legend">Name</legend>
          <input name="name" class="input w-full" placeholder="Acme Blog" required>
        </fieldset>
        <div class="modal-action">
          <button type="button" class="btn" data-close-dialog>Cancel</button>
          <button type="submit" class="btn btn-primary">Create</button>
        </div>
      </form>
    </div>
    <form method="dialog" class="modal-backdrop"><button>close</button></form>
  </dialog>

  <script src="./app.js"></script>
</body>
</html>
